[project]
name = "factory-standard"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18", "pyyaml>=6", "PyJWT[crypto]>=2.8"]
[project.scripts]
factory = "factory.__main__:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["factory"]
[tool.hatch.build.targets.wheel.force-include]
"schema" = "schema"
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
